<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In | AQUA CERAMICS LLP</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand-logo">
        <div class="brand-mark">AC</div>
        <div class="brand-info">
          <span class="brand-name">AQUA CERAMICS LLP</span>
          <span class="brand-tagline">DESIGNED FOR COMFORT BUILT FOR LIFE</span>
        </div>
      </a>
      <a href="/" class="btn btn-outline btn-sm">← Back to Storefront</a>
    </div>
  </header>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="max-width: 420px; width: 100%; background: #ffffff; padding: 36px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-mark" style="display: inline-block; margin-bottom: 12px; font-size: 1.5rem; padding: 10px 18px;">AC</div>
        <h2 style="color: var(--primary-blue-deep); font-size: 1.6rem; margin-bottom: 4px;">Admin Portal</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Aqua Ceramics LLP Staff Portal</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin_username">Username</label>
          <input type="text" id="admin_username" class="form-control" placeholder="Enter admin username" required value="admin" />
        </div>

        <div class="form-group">
          <label class="form-label" for="admin_password">Password</label>
          <input type="password" id="admin_password" class="form-control" placeholder="Enter password" required value="AquaAdmin2026!" />
        </div>

        <button type="submit" id="admin-login-btn" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
          Sign In to Admin Portal
        </button>
      </form>

      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        🔒 Default Seed Account Credentials:<br>
        Username: <code>admin</code> | Password: <code>AquaAdmin2026!</code>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
